[project]
name = "mifisec-scraper"
version = "1.0.0"
description = "SkillFactory MIFISEC course → Obsidian vault scraper"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.24"]

[project.scripts]
mifisec = "mifisec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
